var lastBlockMsg='',lastBlockT=0,moveBlocked=false;function blockSay(t){const n=Date.now();if(t===lastBlockMsg&&n-lastBlockT<1500)return;lastBlockMsg=t;lastBlockT=n;say(t)}
function move(f){moveBlocked=false;if(!PASS)PEND=null;const nx=S.x+DX[f],ny=S.y+DY[f];S.med=false;const z=zoneAt(nx,ny);if(!z){sfx('bump');if(Date.now()-lastBump>1500)say('ขอบแผนที่ ไปต่อไม่ได้');lastBump=Date.now();moveBlocked=true;return}
 const nb=npcAt(nx,ny,z);if(nb){walk=false;moveBlocked=true;sfx('bump');sfx('npc_'+nb.npc,panOf(nb),1.01);blockSay('ชน '+nb.n+' ตรงนี้ กด F คุยได้');return}const oz=zoneAt(S.x,S.y);if(z!==oz&&!PASS&&!(z.open&&oz.open)){PEND={f};walk=false;moveBlocked=true;sfx('open');blockSay('ถึงทางเข้า '+z.n+(z.min>S.step?(z.safe?' (ขั้นยังไม่ถึง เข้าไม่ได้)':' (อันตราย เกินระดับของเจ้า)'):'')+' กด Enter เพื่อเข้า');return}if(z!==oz&&z.min>S.step&&!godOn()){moveBlocked=true;walk=false;sfx('bump');blockSay('ยังเข้า '+z.n+' ไม่ได้ ต้องถึง'+realmName(z.min)+'ก่อน (ตอนนี้ '+realmName(S.step)+')');return}S.x=nx;S.y=ny;sfx('step');const nd0=ND.find(a=>!a.dead&&a.x===nx&&a.y===ny);if(nd0){nd0.dead=Date.now();add(nd0.id,1);say('เก็บ '+I[nd0.id].n+' เข้ากระเป๋า');sfx('pick')}
 if(z!==oz){say('เข้าสู่ '+z.n+(z.safe?' เขตปลอดภัย':''));if(z.min>S.step&&!godOn())die('แรงกดดันปราณในหุบเขาทำให้เจ้าล้มลงทันที')}}

function add(id,q){const s=S.inv.find(a=>a.id===id);if(s)s.q+=q;else S.inv.push({id,q})}
function rem(id){const s=S.inv.find(a=>a.id===id);if(s&&--s.q<=0)S.inv.splice(S.inv.indexOf(s),1)}
function invMenu(keep){const it=[{t:'เหรียญทอง '+S.coin+' เหรียญ (กดแลก 200 เหรียญ เป็นหินวิญญาณ 1 ก้อน)',id:'$c'},{t:'หินวิญญาณ '+Math.floor(S.gold/100)+' ก้อน เศษ '+S.gold%100+' (สกุลเงินหลัก ใช้ซื้อของ กดดูดซับ 1 ก้อน = 4 แต้มฝึกฝน)',id:'$s'}].concat(S.inv.map(s=>({t:I[s.id].n+' จำนวน '+s.q+(I[s.id].u==='eq'?' โจมตี +'+I[s.id].atk:''),id:s.id})));
 menu('กระเป๋า',it,{ent:x=>{if(x.id[0]==='$')coinUse(x.id);else useItem(x.id);invMenu(true)},del:x=>x.id[0]==='$'?say('ทิ้งเงินไม่ได้'):conf('ทิ้ง '+I[x.id].n+'?',()=>{rem(x.id);S.ground.push({x:S.x,y:S.y,id:x.id,q:1,mine:1});say('ทิ้งแล้ว');mode='play'})});if(keep){}}
function useItem(id){const d=I[id];if(!lvOk(id))return;if(d.u==='hp'){S.hp=Math.min(mhp(),S.hp+d.v);rem(id);say('กินโอสถ HP '+Math.floor(S.hp))}else if(d.u==='qi'){S.qi=Math.min(mqi(),S.qi+d.v);rem(id);say('กินโอสถ ปราณ '+Math.floor(S.qi))}
 else if(d.u==='xp'){S.exp+=d.v;rem(id);say('ดูดซับ '+d.n+' ได้แต้มฝึกฝน '+d.v);sfx('levelup')}else if(d.u==='esc'){rem(id);S.x=27;S.y=46;S.med=false;walk=false;say('ยันต์ทำงาน ถูกส่งกลับหมู่บ้านลำธารใส')}else if(d.u==='pf')say('ใช้ตอนทะลวงด้วยปุ่ม B ที่ขั้นสูงสุด');else if(d.u==='eq'){rem(id);if(S.wpn)add(S.wpn,1);S.wpn=id;say('สวมใส่ '+d.n+' โจมตี +'+d.atk)}
 else if(d.u==='sk'){if(S.known.includes(d.k))say('เรียนวิชานี้แล้ว');else{S.known.push(d.k);rem(id);say('เรียนรู้ '+SK[d.k].n+' กด S เพื่อติดตั้ง')}}else say('ไม่มีผลเมื่อใช้ ขายหรือใช้ปรุงยาได้ในอนาคต')}

function nearest(r){let b=null,bd=r;MS.forEach(m=>{if(!m.dead&&m.z===zoneAt(S.x,S.y)?.id){const d=dist(S,m);if(d<=bd){bd=d;b=m}}});return b}
function useSlot(i,quiet){const id=S.slots[i];if(!id){say('ช่อง '+(i+1)+' ว่าง');return 0}const k=SK[id],now=Date.now();if(k.passive){if(id==='fly')A.fly();return 0}
 if(cd[id]&&now<cd[id])return 0;if(S.qi<k.c){if(!quiet||!warned){say('ปราณไม่พอ');warned=1}return 0}
 if(k.buff){S.qi-=k.c;cd[id]=now+k.cd*1000;buff=now+10000;say('ร่ายเกราะปราณ ลดความเสียหาย 50% นาน 10 วินาที');sfx('cast');return 1}
 if(!target||target.dead||dist(S,target)>k.rng){target=nearest(k.rng)}
 if(!target){if(!quiet||!warned){say('ไม่มีเป้าหมายในระยะ '+k.rng+' ก้าว');warned=1}return 0}
 warned=0;S.qi-=k.c;cd[id]=now+k.cd*1000;S.med=false;const d=Math.max(1,Math.round(atk()*k.m*(.9+Math.random()*.2)));target.hp-=d;target.ag=1;sfx(k.rng>2?'cast':'hit');
 const m=MD[target.k];if(target.hp<=0){kill(target)}else say(k.n+' โจมตี '+m.n+' '+d+' เหลือ '+Math.floor(target.hp));return 1}
function kill(m){const d=MD[m.k];m.dead=Date.now();S.exp+=d.xp;say('สังหาร '+d.n+' ได้แต้ม '+d.xp);let sh=0;if(d.sh)sh=d.sh[0]+Math.floor(Math.random()*(d.sh[1]-d.sh[0]+1));
 if(d.lo)sh=100*(Array.isArray(d.lo)?d.lo[0]+Math.floor(Math.random()*(d.lo[1]-d.lo[0]+1)):d.lo);if(sh)S.ground.push({x:S.x,y:S.y,gold:sh});{const cr=COIN[m.k];if(cr)S.ground.push({x:S.x,y:S.y,coin:cr[0]+Math.floor(Math.random()*(cr[1]-cr[0]+1))})}
 d.it.forEach(i=>{if(i==='wpn_hi'||Math.random()<.5)S.ground.push({x:S.x,y:S.y,id:i,q:1})});if(m.k==='rab')S.q.k++;target=null;autoLoot(m);sfx('pick')}

 const n=W.filter(w=>w.npc&&w.z===z.id&&dist(S,w)<=r);const nd=ND.filter(a=>!a.dead&&a.z===z.id&&dist(S,a)<=r);nd.slice(0,4).forEach(a=>say('สมุนไพร '+I[a.id].n+' '+rel(a.x-S.x,a.y-S.y)));if(!l.length&&!n.length&&!nd.length)return say('ไม่พบเป้าหมายรอบตัว');
 n.forEach(w=>say('NPC '+w.n+' '+rel(w.x-S.x,w.y-S.y)));l.slice(0,5).forEach(m=>say(MD[m.k].n+' ระดับพลัง '+mpw(m.k)+' '+rel(m.x-S.x,m.y-S.y)));
 rl=l;rlT=Date.now()+8000;if(l.length){target=l[0];say('ล็อกเป้า '+MD[l[0].k].n+' ลูกศรซ้ายขวาสลับเป้า')}},

function purgeLines(prefix){
 S.chat.forEach(a=>{for(let i=a.length-1;i>=0;i--)if(typeof a[i]==='string'&&a[i].indexOf(prefix)===0)a.splice(i,1)});

function dailyText(){
 const d=new Date(),di=Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);
 const bs=MS.filter(m=>BOSSES.includes(m.k)).map(m=>MD[m.k].n+(m.dead?' เกิดอีก '+Math.max(1,Math.ceil((respMs(m)-(Date.now()-m.dead))/60000))+' นาที':' พร้อมท้า')).join(' / ');
 return 'ข้อความประจำวัน '+d.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' : '+TIPS[((di%TIPS.length)+TIPS.length)%TIPS.length]+(bs?' บอส: '+bs:'')}
function showDaily(){purgeLines('ข้อความประจำวัน ');say(dailyText(),1)}
daily=function(){const k=dayKey();if(S.dly===k)return;S.dly=k;showDaily()};

<script>

 acct:()=>CLOUD&&!!FB&&LOCALOK(),

function sha256js(s){const K=[],H=[];for(let n=2,c=0;c<64;n++){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}if(p){if(c<8)H.push(Math.floor(Math.pow(n,.5)%1*4294967296));K.push(Math.floor(Math.pow(n,1/3)%1*4294967296));c++}}
const b=new TextEncoder().encode(s),l=b.length,N=((l+9+63)>>6)<<6,m=new Uint8Array(N);m.set(b);m[l]=128;const dv=new DataView(m.buffer);dv.setUint32(N-8,Math.floor(l*8/4294967296));dv.setUint32(N-4,(l*8)>>>0);
const w=new Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));let h=H.slice();
for(let o=0;o<N;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a1=w[i-15],c1=w[i-2];w[i]=(w[i-16]+(r(a1,7)^r(a1,18)^(a1>>>3))+w[i-7]+(r(c1,17)^r(c1,19)^(c1>>>10)))>>>0}
let a=h[0],b2=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];for(let i=0;i<64;i++){const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))>>>0;hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
h=[h[0]+a,h[1]+b2,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x>>>0)}
return h.map(x=>x.toString(16).padStart(8,'0')).join('')}
const hsOld=(pw,salt)=>{let h=5381;const s=salt+':'+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+h};
async function hs(pw,salt){try{return hex(await DIG('SHA-256',new TextEncoder().encode(salt+':'+pw)))}catch(e){return sha256js(salt+':'+pw)}}
async function pwOk(ac,mail,pw){if(ac.hash&&ac.hash[0]==='x'){if(ac.hash!==hsOld(pw,ac.salt))return false;try{const a=accs();a[mail].hash=await hs(pw,ac.salt);put(a)}catch(e){}return true}return ac.hash===await hs(pw,ac.salt)}

async function cloudStart(email,name){
 const u=FB.auth.currentUser;if(!u)throw new Error('ยังไม่ได้เข้าสู่ระบบ');

 DBGM=!!(cd&&cd.isGM===true);const cs=cd&&typeof cd.save==='string'?cd.save:null;let ls=null;try{ls=localStorage.getItem(KEY)}catch(e){}

 if(cs&&(!ls||tOf(cs)>=tOf(ls))){try{localStorage.setItem(KEY,cs)}catch(e){}ls=cs}
 else if(ls){try{await push(ls)}catch(e){throw new Error('ส่งข้อมูลขึ้นเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง')}}
 let last=null,sent=ls?body(ls):null,timer=null;
 const flush=()=>{if(last==null)return;const s=last;last=null;const b=body(s);if(b===sent)return;sent=b;push(s).catch(()=>{sent=null;if(last==null)last=s})};
 const orig=Storage.prototype.setItem;

 addEventListener('pagehide',flush);addEventListener('beforeunload',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
}
