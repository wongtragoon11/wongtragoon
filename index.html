 E('login').hidden=true;E('app').hidden=false;E('l_out').hidden=false;const g=document.createElement('script');window.__gmv=GMX;g.textContent='(function(){const GMV=window.__gmv;try{delete window.__gmv}catch(e){window.__gmv=undefined}\n'+E('game').textContent+'\n})();';document.body.appendChild(g);try{delete window.__gmv}catch(e){}setTimeout(()=>{if(!window.__GAME_OK)fatal('เกมโหลดไม่สำเร็จ')},300)}catch(e){E('login').hidden=false;E('app').hidden=true;msg('เริ่มเกมไม่สำเร็จ '+e.message)}}
const vals=()=>({name:E('l_name').value.trim(),mail:E('l_mail').value.trim().toLowerCase(),pw:E('l_pass').value});
const errTh=e=>{const c=(e&&e.code)||'';if(c==='auth/email-already-in-use')return 'อีเมลนี้มีบัญชีแล้ว กดเข้าสู่ระบบ';if(c==='auth/weak-password')return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัว';if(c==='auth/invalid-email')return 'อีเมลไม่ถูกต้อง';if(c==='auth/network-request-failed')return 'ต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่';if(c==='auth/operation-not-allowed')return 'เซิร์ฟเวอร์ยังไม่เปิดการล็อกอินด้วยอีเมลและรหัสผ่าน';if(c==='auth/too-many-requests')return 'ลองหลายครั้งเกินไป รอสักครู่แล้วลองใหม่';if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')return 'ชื่อ อีเมล หรือรหัสผ่านไม่ถูกต้อง';return 'เกิดข้อผิดพลาด '+(c||(e&&e.message)||'')};
E('l_new').onclick=async()=>{const v=vals();if(v.name.length<2)return msg('กรุณาใส่ชื่อตัวละคร อย่างน้อย 2 ตัวอักษร');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.mail))return msg('อีเมลไม่ถูกต้อง');if(v.pw.length<6)return msg('รหัสผ่านต้องมีอย่างน้อย '+6+' ตัว');
 if(CLOUD){if(!FB)return msg('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองรีเฟรชหน้า');try{const cr=await FB.au.createUserWithEmailAndPassword(FB.auth,v.mail,v.pw);await FB.fs.setDoc(FB.fs.doc(FB.db,'users',cr.user.uid),{name:v.name,email:v.mail,t:0},{merge:true});msg('สร้างบัญชีสำเร็จ');window.__NEWACC=1;pwAuthed=true;start(v.mail,v.name)}catch(e){msg(errTh(e))}return}
 const a=accs();if(a[v.mail])return msg('อีเมลนี้มีบัญชีแล้ว กดเข้าสู่ระบบ');const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);a[v.mail]={name:v.name,salt,hash:await hs(v.pw,salt)};if(!put(a))return msg('บันทึกบัญชีไม่ได้ เบราว์เซอร์ปิดการเก็บข้อมูล');msg('สร้างบัญชีสำเร็จ');window.__NEWACC=1;pwAuthed=true;start(v.mail,v.name)};
E('l_in').onclick=async()=>{const v=vals();if(!v.name||!v.mail||!v.pw)return msg('กรุณาใส่ชื่อ อีเมล และรหัสผ่านให้ครบ');
 if(CLOUD){if(!FB)return msg('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองรีเฟรชหน้า');try{const cr=await FB.au.signInWithEmailAndPassword(FB.auth,v.mail,v.pw);let nm=null;try{const sn=await FB.fs.getDoc(FB.fs.doc(FB.db,'users',cr.user.uid));nm=sn.exists()?sn.data().name:null}catch(e){}
  if(nm&&nm.toLowerCase()!==v.name.toLowerCase()){try{await FB.au.signOut(FB.auth)}catch(e){}return msg('ชื่อ อีเมล หรือรหัสผ่านไม่ถูกต้อง')}msg('');pwAuthed=true;start(v.mail,nm||v.name)}catch(e){msg(errTh(e))}return}
 const ac=accs()[v.mail];if(!ac||ac.name.toLowerCase()!==v.name.toLowerCase()||!(await pwOk(ac,v.mail,v.pw)))return msg('ชื่อ อีเมล หรือรหัสผ่านไม่ถูกต้อง');msg('');pwAuthed=true;start(v.mail,ac.name)};
E('l_pass').addEventListener('keydown',e=>{if(e.key==='Enter')E('l_in').onclick()});
E('l_out').onclick=async()=>{try{localStorage.removeItem('ipo_rem');localStorage.removeItem('ipo_tok');sessionStorage.removeItem('ipo_sess')}catch(e){}try{if(typeof FB!=='undefined'&&FB)await FB.au.signOut(FB.auth)}catch(e){}location.reload()};
try{const s=sessionStorage.getItem('ipo_sess')||remM();
 if(CLOUD){if(FB){await FB.auth.authStateReady();const u=FB.auth.currentUser;if(s&&u&&u.email&&u.email.toLowerCase()===s){let nm=null;try{const sn=await FB.fs.getDoc(FB.fs.doc(FB.db,'users',u.uid));nm=sn.exists()?sn.data().name:null}catch(e){}start(s,nm||'ผู้ฝึกตน')}else E('l_name').focus()}else{msg('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองรีเฟรชหน้า')}}
 else{const a=accs();if(s&&a[s])start(s,a[s].name);else E('l_name').focus()}}catch(e){}})();
</script></body></html>
